<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atmos Weather</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body id="refresh-body">

    <div class="video-container">
        <video autoplay muted loop playsinline id="video-light">
            <source src="morning.mp4" type="video/mp4">
        </video>
        <video autoplay muted loop playsinline id="video-dark">
            <source src="night.mp4" type="video/mp4">
        </video>
    </div>

    <div id="auth-modal">
        <div class="auth-box">
            <button id="close-modal">&times;</button>
            <h2 id="modal-title">Login</h2>
            
            <input type="email" id="auth-email" placeholder="Email Address">
            <input type="password" id="auth-pass" placeholder="Password">
            <button id="auth-action-btn">Submit</button>

            <button id="google-btn">
                <i class="fa-brands fa-google"></i> Sign in with Google
            </button>

            <p id="toggle-auth-mode">Need an account? Sign Up</p>
        </div>
    </div>

    <nav>
        <div class="logo"><i class="fa-solid fa-cloud-bolt"></i> Atmos</div>
        <div class="nav-buttons">
            <span id="user-email"></span>
            <button id="login-btn">Login</button>
            <button id="logout-btn" style="display: none;">Logout</button>
            <button id="theme-toggle" aria-label="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="search">
                <input type="text" placeholder="Enter city..." spellcheck="false" id="city-input" list="city-suggestions">
                <datalist id="city-suggestions">
                    <option value="Mumbai"></option>
                    <option value="Delhi"></option>
                    <option value="Bangalore"></option>
                    <option value="London"></option>
                    <option value="New York"></option>
                    <option value="Tokyo"></option>
                </datalist>
                <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                <button id="location-btn"><i class="fa-solid fa-location-crosshairs"></i></button>
            </div>
            
            <div id="loader" style="display: none;"><div class="spinner"></div></div>
            <div class="error" style="display: none;"><p>Invalid City Name!</p></div>

            <div class="weather" style="display: none;">
                <img src="" class="weather-icon" alt="Weather Icon">
                <h1 class="temp">--°c</h1>
                <h2 class="city">City</h2>
                
                <div class="details">
                    <div class="col">
                        <i class="fa-solid fa-water"></i>
                        <div><p class="humidity">--%</p><p>Humidity</p></div>
                    </div>
                    <div class="col">
                        <i class="fa-solid fa-wind"></i>
                        <div><p class="wind">-- km/h</p><p>Wind</p></div>
                    </div>
                </div>

                <div id="forecast-section" style="display: none;">
                    <hr class="separator">
                    <div class="forecast-container" id="forecast"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
  apiKey: "AIzaSyAm5cZfnsn-H1GC-XSIh9b-SY3AeidkHic",
  authDomain: "weather-app-14b1b.firebaseapp.com",
  projectId: "weather-app-14b1b",
  storageBucket: "weather-app-14b1b.firebasestorage.app",
  messagingSenderId: "253973957194",
  appId: "1:253973957194:web:33e20637dc463e3eafb4b3",
  measurementId: "G-7Z10SXWB7T"
};

        try {
            // Initialize
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            
            // --- EXPOSE TO WINDOW (The Bridge) ---
            window.auth = auth;
            window.db = db;
            
            // Auth Functions
            window.createUser = createUserWithEmailAndPassword;
            window.signIn = signInWithEmailAndPassword;
            window.logout = signOut;
            window.userState = onAuthStateChanged;
            
            // Database Functions
            window.dbSet = setDoc;
            window.dbGet = getDoc;
            window.dbDoc = doc;

            // Google Auth Functions
            window.googleProvider = new GoogleAuthProvider();
            window.googleSignIn = signInWithPopup;
            
            console.log("✅ Atmos Weather Firebase Ready");
            window.firebaseReady = true; 
        } catch (e) {
            console.error("❌ Firebase Failed to Load:", e);
            alert("Database Connection Error. Check Console.");
        }
    </script>

    <script src="script.js" defer></script>
</body>
</html>
